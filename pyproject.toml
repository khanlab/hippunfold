[project]
name = "hippunfold"
dynamic = ["version"]
description = "BIDS App for Hippocampal AutoTop (automated hippocampal unfolding and subfield segmentation)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ali R. Khan", email = "alik@robarts.ca" },
    { name = "Jordan DeKraker", email = "jordandekraker@gmail.com" },
]
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
hippunfold = "hippunfold.run:app.run"
hippunfold-quick = "hippunfold.run_quick:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+(?:(?:a|b|rc)\\d+|\\.post\\d+|\\.post\\d+\\.dev\\d+|\\.dev\\d+)?)$"
fallback_version = "0.0.0.dev0"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "hippunfold/_version.py"


# ----------------------------------------------------------------------
# Pixi workspace
# ----------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda", "https://prefix.dev/akhanf/khanlab" ]
platforms = ["linux-64"]
preview = ["pixi-build"]


# ----------------------------------------------------------------------
# Shared dependency specifications
#
# These are the canonical versions used both by the Pixi runtime
# environment and by the published conda package.
# ----------------------------------------------------------------------

[tool.pixi.workspace.dependencies]
python = ">=3.12,<3.15"
snakebids = ">=0.14.0,<0.15"
appdirs = ">=1.4.4,<2.0.0"
conda = ">=26,<27"
snakemake-storage-plugin-http = ">=0.3.0,<0.4"
unzip = ">=6,<7"
laynii = ">=2.7.0,<3"
nilearn = ">=0.13.1,<0.15"
matplotlib = ">=3.9.1,<4"
pandas = ">=3.0.6,<4"
seaborn = ">=0.13.2,<0.14"
niftyreg = ">=1.5.69.6,<2"
numpy = ">=2.5.3,<3"
astropy = ">=8.0.1,<9"
nibabel = ">=5.4.2,<6"
scikit-fmm = ">=2025.6.23,<2026"
scipy = ">=1.18.1,<2"
networkx = ">=3.7,<4"
connectome-workbench-cli = ">=2.2.1,<3"
pyvista = ">=0.49.0,<0.50"
ants = ">=2.6.5,<3"
greedyreg = ">=0.0.20250712,<0.0.20250713"
convert3d = { version = ">=1.4.2,<2", build = "libitk547_*" }

# ----------------------------------------------------------------------
# Conda package
# ----------------------------------------------------------------------

[tool.pixi.package]
name = "hippunfold"
version = "0.0.0.dev0"
publish = true


[tool.pixi.package.build.config]
noarch = false

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["conda-forge"]


[tool.pixi.package.host-dependencies]
python = { workspace = true }
hatchling = "*"

[tool.pixi.package.run-dependencies]
python = { workspace = true }
snakebids = { workspace = true }
appdirs = { workspace = true }
conda = { workspace = true }
snakemake-storage-plugin-http = { workspace = true }
unzip = { workspace = true }
laynii = { workspace = true }
nilearn = { workspace = true }
matplotlib = { workspace = true }
pandas = { workspace = true }
seaborn = { workspace = true }
niftyreg = { workspace = true }
numpy = { workspace = true }
astropy = { workspace = true }
nibabel = { workspace = true }
scikit-fmm = { workspace = true }
scipy = { workspace = true }
networkx = { workspace = true }
connectome-workbench-cli = { workspace = true }
pyvista = { workspace = true }
ants = { workspace = true }
greedyreg = { workspace = true }
convert3d = { workspace = true }

[tool.pixi.pypi-dependencies]
hippunfold = { path = ".", editable = true }


# ----------------------------------------------------------------------
# Runtime environment
# ----------------------------------------------------------------------

[tool.pixi.feature.runtime.dependencies]
python = { workspace = true }
snakebids = { workspace = true }
appdirs = { workspace = true }
conda = { workspace = true }
snakemake-storage-plugin-http = { workspace = true }
unzip = { workspace = true }
laynii = { workspace = true }
nilearn = { workspace = true }
matplotlib = { workspace = true }
pandas = { workspace = true }
seaborn = { workspace = true }
niftyreg = { workspace = true }
numpy = { workspace = true }
astropy = { workspace = true }
nibabel = { workspace = true }
scikit-fmm = { workspace = true }
scipy = { workspace = true }
networkx = { workspace = true }
connectome-workbench-cli = { workspace = true }
pyvista = { workspace = true }
ants = { workspace = true }
greedyreg = { workspace = true }
convert3d = { workspace = true }


# ----------------------------------------------------------------------
# Development dependencies
# ----------------------------------------------------------------------

[tool.pixi.feature.dev.dependencies]
pytest-console-scripts = ">=1,<2"
pygraphviz = "*"
ruff = ">=0.16.9,<0.17"
Jinja2 = ">=3,<4"
pytest = ">=9,<10"
snakefmt = ">=2,<3"


# ----------------------------------------------------------------------
# Environments
# ----------------------------------------------------------------------

[tool.pixi.environments.default]
features = ["runtime"]

[tool.pixi.environments.dev]
features = ["runtime", "dev"]

[tool.pixi.environments.dev-only]
features = ["dev"]


# ----------------------------------------------------------------------
# Development tasks
# ----------------------------------------------------------------------

[tool.pixi.feature.dev.tasks]
quality_check = "ruff check hippunfold && snakefmt hippunfold --check"
quality_fix = "ruff check --fix hippunfold && ruff format hippunfold && snakefmt hippunfold"


# ----------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------

[tool.ruff]
builtins = ["snakemake"]

[tool.ruff.lint]
ignore = ["SIM115"] # for logging redirect

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
