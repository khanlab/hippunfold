[project]
name = "hippunfold"
version = "1.5.2-pre.2"
description = "BIDS App for Hippocampal AutoTop (automated hippocampal unfolding and subfield segmentation)"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Ali R. Khan", email = "alik@robarts.ca"},
    {name = "Jordan DeKraker", email = "jordandekraker@gmail.com"},
    ]
requires-python = ">=3.12,<3.15"
dependencies = []
scripts = { hippunfold = "hippunfold.run:app.run", "hippunfold-quick" = "hippunfold.run_quick:main" }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda", "khanlab"]
platforms = ["linux-64"]

[tool.pixi.feature.runtime.dependencies]
python = ">=3.12,<3.15"
snakebids = ">=0.14.0,<0.15"
appdirs   = ">=1.4.4,<2.0.0"
conda = ">=26,<27"
snakemake-storage-plugin-http = ">=0.3.0,<0.4"
unzip = ">=6,<7"
laynii = ">=2.7.0,<3"
nilearn = ">=0.13.1,<0.15"
matplotlib = ">=3.9.1,<4"
pandas = ">=2.3.3,<4"
seaborn = ">=0.13.2,<0.14"
niftyreg = ">=1.5.69.6,<2"
numpy = ">=2.5.3,<3"
astropy = ">=8.0.1,<9"
nibabel = ">=5.4.2,<6"
scikit-fmm = ">=2025.6.23,<2026"
scipy = ">=1.18.1,<2"
networkx = ">=3.7,<4"
connectome-workbench-cli = ">=2.2.1,<3"
pyvista = ">=0.49.0,<0.50"
ants = ">=2.6.5,<3"
greedyreg = ">=0.0.20250712,<0.0.20250713"
convert3d = {version=">=1.4.2,<2", channel="khanlab"}


[tool.pixi.feature.dev.dependencies]
pytest-console-scripts = ">=1,<2"
pygraphviz = "*"
Jinja2 = ">=3,<4"
black = ">=26,<27"
isort = ">=9,<10"
pytest = ">=9,<10"
snakefmt = ">=2,<3"
poethepoet = ">=0.10,<0.11"


[tool.pixi.environments.default]
features = ["runtime"]

[tool.pixi.environments.dev]
features = ["runtime", "dev"]

[tool.pixi.environments.dev-only]
features = ["dev"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pixi.pypi-dependencies]
hippunfold = { path = ".", editable = true }


[tool.pixi.feature.dev.tasks]
quality_check = "isort hippunfold --check-only && black hippunfold --check && snakefmt hippunfold --check"
quality_fix = "isort hippunfold && black hippunfold && snakefmt hippunfold"
