name: Build and Upload Conda Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build (for example v2.1.0)"
        required: true
        type: string

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREFIX_UPLOAD_URL: https://prefix.dev/api/v1/upload/akhanf/khanlab

    steps:
      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          fi
          RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_tag }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.14
        with:
          run-install: false

      - name: Validate release version matches package metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          release_version = os.environ["RELEASE_VERSION"]
          project_version = data["project"]["version"]
          package_version = data["tool"]["pixi"]["package"]["version"]

          if project_version != release_version or package_version != release_version:
              raise SystemExit(
                  f"Release version {release_version} must match project.version "
                  f"({project_version}) and tool.pixi.package.version ({package_version})."
              )
          PY

      - name: Build conda package from release
        run: pixi publish --target-dir dist

      - name: Upload package to prefix.dev
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${PREFIX_API_KEY}"
          pixi upload "${PREFIX_UPLOAD_URL}" dist/*.conda --api-key "${PREFIX_API_KEY}"
