name: Build and Upload Conda Package

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC token
    env:
      PREFIX_CHANNEL: akhanf/khanlab

    steps:
      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ github.event.release.tag_name }}"

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.post[0-9]+(\.dev[0-9]+)?|\.dev[0-9]+)?$ ]]; then
            echo "Release tag must match vX.Y.Z or a supported PEP 440 suffix (e.g. rcN, .postN, .devN), got: ${RELEASE_TAG}"
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_tag }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      - name: Inject release version into conda package metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib

          release_version = os.environ["RELEASE_VERSION"]
          pyproject_path = pathlib.Path("pyproject.toml")
          lines = pyproject_path.read_text(encoding="utf-8").splitlines(keepends=True)

          in_package_section = False
          version_updated = False

          for idx, line in enumerate(lines):
            stripped = line.strip()
            if stripped == "[tool.pixi.package]":
              in_package_section = True
              continue
            if in_package_section and stripped.startswith("[") and stripped != "[tool.pixi.package]":
              break
            if in_package_section and stripped.startswith("version = "):
              lines[idx] = f'version = "{release_version}"\n'
              version_updated = True
              break

          if not version_updated:
            raise SystemExit("Failed to update [tool.pixi.package] version in pyproject.toml")

          pyproject_path.write_text("".join(lines), encoding="utf-8")
          PY

          package_version=$(awk -F'"' '
            /^\[tool\.pixi\.package\]/ { in_package=1; next }
            /^\[/ && in_package { exit }
            in_package && /^version = "/ { print $2; exit }
          ' pyproject.toml)

          if [ "${package_version}" != "${RELEASE_VERSION}" ]; then
            echo "Failed to set conda package version to release version ${RELEASE_VERSION}."
            exit 1
          fi
          
      - name: Publish and upload
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          pixi publish 
          pixi upload prefix --channel ${PREFIX_CHANNEL} *.conda
