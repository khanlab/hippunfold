name: Build and Upload Conda Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build (for example v2.1.0)"
        required: true
        type: string

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREFIX_CHANNEL: akhanf/khanlab
      PACKAGE_OUTPUT_DIR: ${{ runner.temp }}/pixi-conda-dist

    steps:
      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          fi
          RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_tag }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.14
        with:
          auth-host: prefix.dev
          auth-token: ${{ secrets.PREFIX_API_KEY }}
          run-install: false

      - name: Validate release version matches package metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          project_version=$(awk -F'"' '
            /^\[project\]/ { in_project=1; next }
            /^\[/ && in_project { exit }
            in_project && /^version = "/ { print $2; exit }
          ' pyproject.toml)
          package_version=$(awk -F'"' '
            /^\[tool\.pixi\.package\]/ { in_package=1; next }
            /^\[/ && in_package { exit }
            in_package && /^version = "/ { print $2; exit }
          ' pyproject.toml)

          if [ "${project_version}" != "${RELEASE_VERSION}" ] || [ "${package_version}" != "${RELEASE_VERSION}" ]; then
            echo "Release version ${RELEASE_VERSION} must match project.version (${project_version}) and tool.pixi.package.version (${package_version})."
            exit 1
          fi

      - name: Build conda package from release
        run: |
          rm -rf "${PACKAGE_OUTPUT_DIR}"
          mkdir -p "${PACKAGE_OUTPUT_DIR}"
          pixi publish --target-dir "${PACKAGE_OUTPUT_DIR}"

      - name: Upload package to prefix.dev
        shell: bash -l {0}
        run: |
          set -euo pipefail
          mapfile -t packages < <(
            find "${PACKAGE_OUTPUT_DIR}" -type f \( -name "*.conda" -o -name "*.tar.bz2" \)
          )
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No conda package artifact found in ${PACKAGE_OUTPUT_DIR} after pixi publish."
            exit 1
          fi
          pixi upload prefix "${packages[@]}" --channel "${PREFIX_CHANNEL}"
