name: Build and Upload Conda Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build (for example v2.1.0)"
        required: true
        type: string

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC token
    env:
      PREFIX_CHANNEL: akhanf/khanlab

    steps:
      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Release tag must match vX.Y.Z or a PEP 440 prerelease form such as vX.Y.Zrc1, got: ${RELEASE_TAG}"
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release_tag }}

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      - name: Inject release version into conda package metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          python -m pip install --quiet tomlkit
          python - <<'PY'
          import os
          import pathlib
          import tomlkit

          release_version = os.environ["RELEASE_VERSION"]
          pyproject_path = pathlib.Path("pyproject.toml")
          pyproject_data = tomlkit.parse(pyproject_path.read_text(encoding="utf-8"))
          pyproject_data["tool"]["pixi"]["package"]["version"] = release_version
          pyproject_path.write_text(tomlkit.dumps(pyproject_data), encoding="utf-8")
          PY

          package_version=$(awk -F'"' '
            /^\[tool\.pixi\.package\]/ { in_package=1; next }
            /^\[/ && in_package { exit }
            in_package && /^version = "/ { print $2; exit }
          ' pyproject.toml)

          if [ "${package_version}" != "${RELEASE_VERSION}" ]; then
            echo "Failed to set conda package version to release version ${RELEASE_VERSION}."
            exit 1
          fi
          
      - name: Publish and upload
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          pixi publish 
          pixi upload prefix --channel ${PREFIX_CHANNEL} *.conda
